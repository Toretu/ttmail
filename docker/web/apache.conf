ServerTokens Prod
ServerSignature Off

<Directory /var/www/html/public>
    AllowOverride None
    Require all granted
    FallbackResource /index.php
</Directory>

# Static UI prototype, served same-origin so it can call /api
Alias /app /var/www/html/mockup
<Directory /var/www/html/mockup>
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
</Directory>
